[project]
name = "course_work_1"
version = "0.1.0"
description = ""
authors = [
    {name = "Serega",email = "kroll-87@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest (>=9.0.1,<10.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "mock (>=5.2.0,<6.0.0)",
    "types-requests (>=2.32.4.20260107,<3.0.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "pandas-stubs (>=2.3.3.260113,<3.0.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.0,<2.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = "venv"

[tool.black]
line-length = 119
target-version = ['py38']
extend-exclude = '''\.git'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 119